version: "prometheus/v1"
service: "my-service"
slos:
  - name: "frontend-api-availability"
    objective: 99.9
    sli:
      events:
        error_query: 'sum(rate(http_requests_total{status=~"5.."}[{{ .window }}]))'
        total_query: 'sum(rate(http_requests_total[{{ .window }}]))'
    alerting:
      name: FrontendAPIAvailabilityAlert
      labels:
        category: "availability"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
  - name: "frontend-response-latency"
    objective: 99.9
    sli:
      raw:
        error_ratio_query: 'histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[{{ .window }}])) by (le)) > bool 0.2'
    alerting:
      name: FrontendResponseLatencyAlert
      labels:
        category: "latency"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
  - name: "frontend-traffic-volume"
    objective: 99.9
    sli:
      raw:
        error_ratio_query: 'sum(rate(http_requests_total[{{ .window }}])) < bool 10'
    alerting:
      name: FrontendTrafficVolumeAlert
      labels:
        category: "traffic"
      page_alert:
        labels:
          severity: warning
      ticket_alert:
        labels:
          severity: info
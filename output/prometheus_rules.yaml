groups:
  - name: frontend-api-slos
    rules:
      - record: frontend_api_availability
        expr: 'sum(rate(http_requests_total{status=~"2.."}[30d])) / sum(rate(http_requests_total[30d]))'
      - alert: FrontendAPIAvailabilityAlert
        expr: 'sum(rate(http_requests_total{status=~"2.."}[30d])) / sum(rate(http_requests_total[30d])) < 0.999'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Frontend API Availability is below target"
          description: "Current availability is below 99.9% over the last 30 days."
      - record: frontend_response_latency
        expr: 'histogram_quantile(0.999, sum(rate(http_response_duration_seconds_bucket[30d])) by (le))'
      - alert: FrontendResponseLatencyAlert
        expr: 'histogram_quantile(0.999, sum(rate(http_response_duration_seconds_bucket[30d])) by (le)) > 0.2'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Frontend Response Latency is above threshold"
          description: "Current latency is above 200ms over the last 30 days."
      - record: frontend_traffic_volume
        expr: 'sum(rate(http_requests_total[30d]))'
      - alert: FrontendTrafficVolumeAlert
        expr: 'sum(rate(http_requests_total[30d])) < 10'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frontend Traffic Volume is below expected"
          description: "Current traffic volume is below expected levels over the last 30 days."
groups:
  - name: slo-rules
    rules:
      - record: avg_cpu_utilization
        expr: avg(rate(container_cpu_usage_seconds_total{job="kubelet", image!="", container!="POD"}[5m])) by (pod)
        labels:
          service: guestbook-ui

      - alert: HighCpuUtilization
        expr: avg(rate(container_cpu_usage_seconds_total{job="kubelet", image!="", container!="POD"}[5m])) by (pod) > 0.7
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Utilization detected for guestbook UI"
          description: "The average CPU utilization is above 70% for the last 5 minutes."

      - alert: CriticalCpuUtilization
        expr: avg(rate(container_cpu_usage_seconds_total{job="kubelet", image!="", container!="POD"}[5m])) by (pod) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU Utilization detected for guestbook UI"
          description: "The average CPU utilization is above 90% for the last 5 minutes.",

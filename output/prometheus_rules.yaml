groups:
  - name: frontend-api-slos
    rules:
      - record: frontend_api_availability
        expr: 'sum(rate(http_requests_total{status=~"2.."}[30d])) / sum(rate(http_requests_total[30d])) * 100'
      - alert: FrontendAPIAvailabilityAlert
        expr: 'sum(rate(http_requests_total{status=~"2.."}[30d])) / sum(rate(http_requests_total[30d])) < 99.9'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Frontend API Availability is below 99.9%"
          description: "Current availability is below the target SLO."
      - record: frontend_response_latency
        expr: 'histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[30d])) by (le))'
      - alert: FrontendResponseLatencyAlert
        expr: 'histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[30d])) by (le)) > 0.2'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Frontend Response Latency is above 200ms"
          description: "Current latency is above the target threshold."
      - record: frontend_error_rate
        expr: 'sum(rate(http_requests_total{status=~"5.."}[30d])) / sum(rate(http_requests_total[30d])) * 100'
      - alert: FrontendErrorRateAlert
        expr: 'sum(rate(http_requests_total{status=~"5.."}[30d])) / sum(rate(http_requests_total[30d])) * 100 > 0.1'
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Frontend Error Rate is above 0.1%"
          description: "Current error rate is above the target SLO."
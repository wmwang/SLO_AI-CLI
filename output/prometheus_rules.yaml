groups:
  - name: guestbook-ui-saturation
    rules:
      - record: guestbook_ui_saturation
        expr: sum(rate(container_memory_usage_bytes{job="guestbook-ui"}[30d])) / sum(container_memory_limit_bytes{job="guestbook-ui"}) * 100
        labels:
          service: guestbook-ui
      - alert: GuestbookUISaturationHigh
        expr: guestbook_ui_saturation > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Guestbook UI Saturation High"
          description: "The saturation of the Guestbook UI service is above 80% for more than 5 minutes.",
